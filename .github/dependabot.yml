version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /mcp/redmed-mcp
    schedule: { interval: weekly }
    groups:
      mcp: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /scripts
    schedule: { interval: weekly }
    groups:
      scripts: { patterns: ['*'] }
