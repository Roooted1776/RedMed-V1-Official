name: iOS build

# Compiles RedMed on macos-latest so Swift errors surface without a local Mac.
# Path-filtered: doc/HTML-only changes skip the macOS runner (10x bill rate on
# private repos; public repo minutes are still finite).
#
# Billing previously forced workflow_dispatch-only. Ubuntu Pages and manual
# macOS builds are green again — restore automatic push/PR compile.
on:
  push:
    branches: [main]
    paths:
      - 'owner/**'
      - 'scripts/test-nfc-hardware.mjs'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'owner/**'
      - 'scripts/test-nfc-hardware.mjs'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      - name: Refuse merge-conflict markers in entitlements
        run: |
          set -euo pipefail
          f=owner/RedMed/RedMed.entitlements
          if grep -qE '^(<<<<<<<|=======|>>>>>>>)' "$f"; then
            echo "::error::$f has unresolved merge conflict markers — Automatic Signing will fail"
            exit 1
          fi
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('$f')"
          echo "OK $f is valid XML plist"

      - name: NFC hardware contract
        run: node scripts/test-nfc-hardware.mjs

      - name: Build RedMed
        run: |
          xcodebuild build \
            -project owner/RedMed.xcodeproj \
            -scheme RedMed \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
