# RM-07: Gitleaks secret scanning
# Scans full git history on push to main/master.
# Scans only the changed diff on pull requests.
# Fails the job (exit 1) if any secret is detected.
# Does NOT block tapper, store, or home page deploys —
# this job runs in parallel with existing gates.yml.
name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for push scans

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # On PRs, gitleaks-action automatically scans only the diff.
        # On push to main it scans the full history.
        # Exit code 1 = secrets found → job fails → PR is blocked.
